# nginx reverse proxy for the supporters overlay.
# Install:  cp to /etc/nginx/sites-available/, symlink into sites-enabled/, then `nginx -t && systemctl reload nginx`.
# Needs a certificate first. deploy/install.sh issues one with certbot (see the bootstrap file next to this one).

limit_req_zone $binary_remote_addr zone=sp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sp_hooks:10m rate=120r/m;

upstream supporters_app {
    server 127.0.0.1:42001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name supporters.amayakulkarni.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supporters.amayakulkarni.com;

    ssl_certificate     /etc/letsencrypt/live/supporters.amayakulkarni.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supporters.amayakulkarni.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 1m;

    # Shared proxy settings. The app reads X-Real-IP / X-Forwarded-Proto from here.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Server-Sent Events: never buffer, keep the connection open for hours.
    # access_log is off on routes whose URL may carry ?key=
    location = /api/stream {
        proxy_pass http://supporters_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        access_log off;
    }
    location = /admin/api/stream {
        proxy_pass http://supporters_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /overlay {
        proxy_pass http://supporters_app;
        access_log off;
    }

    # Short widget URLs (/comments, /goal, …) and sound files: the URL may carry ?key=
    location ~ ^/(counters|alerts|chat|comments|goal|status|latest)$ {
        proxy_pass http://supporters_app;
        access_log off;
    }
    location /sounds/ {
        proxy_pass http://supporters_app;
        access_log off;
    }

    # Sound uploads from the dashboard (up to 3 MB)
    location = /admin/api/sounds {
        client_max_body_size 4m;
        proxy_pass http://supporters_app;
    }

    # Brute-force guard on the admin password form (the app also throttles).
    location = /admin/login {
        limit_req zone=sp_login burst=5 nodelay;
        proxy_pass http://supporters_app;
    }

    # Twitch EventSub and Buy Me a Coffee deliveries.
    location /webhooks/ {
        limit_req zone=sp_hooks burst=60 nodelay;
        proxy_pass http://supporters_app;
    }

    location / {
        proxy_pass http://supporters_app;
    }
}
