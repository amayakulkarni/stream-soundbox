# HTTP-only vhost used once, so certbot can issue the certificate before the real
# TLS config (supporters.amayakulkarni.com.conf) exists. deploy/install.sh handles the swap.

upstream supporters_app {
    server 127.0.0.1:42001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name supporters.amayakulkarni.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        proxy_pass http://supporters_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
