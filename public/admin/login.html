<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · supporters</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login">
  <main class="login-card">
    <h1>supporters</h1>
    <p class="sub">Sign in to manage your overlay.</p>
    <form method="post" action="/admin/login">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
      <p id="err" class="err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/admin/assets/login.js"></script>
</body>
</html>
